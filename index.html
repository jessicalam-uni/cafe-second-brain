<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafe Second Brain</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0071e3; --accent2:#1d8a4a; --warn:#d70015; --glass:rgba(245,245,247,.8);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:#38383a;--accent:#2997ff;--accent2:#30d158;--warn:#ff453a;--glass:rgba(0,0,0,.72);}
}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:#38383a;--accent:#2997ff;--accent2:#30d158;--warn:#ff453a;--glass:rgba(0,0,0,.72);}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:28px 20px 0;text-align:center;border-bottom:1px solid var(--line)}
h1{font-size:2.2rem;font-weight:700;letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--muted);font-size:1.05rem;font-weight:400;margin-bottom:16px}
nav{display:flex;justify-content:center;gap:4px;overflow-x:auto;padding:0 0 12px}
nav button{flex:0 0 auto;padding:7px 16px;border-radius:980px;border:none;background:transparent;color:var(--muted);font:500 .88rem var(--font);cursor:pointer;transition:all .2s}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--ink);color:var(--bg)}
main{padding:28px 20px 80px;max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:1.45rem;font-weight:600;letter-spacing:-.02em;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 .95rem var(--font);outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.18)}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.field{flex:1 1 130px}
.field input,.field select{width:100%}
button.btn{padding:12px 24px;border-radius:980px;border:none;background:var(--accent);color:#fff;font:500 .95rem var(--font);cursor:pointer;transition:opacity .2s,transform .1s}
button.btn:hover{opacity:.88}
button.btn:active{transform:scale(.97)}
button.btn.secondary{background:var(--ink);color:var(--bg)}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 14px;font-size:.82rem}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:12px 6px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
th{color:var(--muted);font-weight:500;font-size:.78rem}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 11px;border-radius:980px;font-size:.75rem;font-weight:600}
.pill.low{background:rgba(215,0,21,.12);color:var(--warn)}
.pill.ok{background:rgba(29,138,74,.14);color:var(--accent2)}
.pill.mid{background:rgba(255,159,10,.16);color:#c77700}
.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.big{font-size:2.8rem;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.muted{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-size:.95rem;padding:18px 0;text-align:center}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
.del:hover{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 .card{margin-bottom:0}
.grid2{margin-bottom:18px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}h1{font-size:1.8rem}}
</style>
</head>
<body>
<header>
  <h1>Cafe Second Brain</h1>
  <div class="sub">Smarter stock. Less waste. One tap to order.</div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>

<script>
const KEY='cafe_brain_v1';
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d) return d; }catch(e){}
  return {
    ingredients:[
      {id:cid(),name:'Milk (L)',stock:12,unit:'L',reorder:8,cost:1.8,supplier:'Local Dairy Co',par:20,email:'orders@localdairy.example'},
      {id:cid(),name:'Coffee Beans (kg)',stock:3,unit:'kg',reorder:4,cost:22,supplier:'Roast House',par:8,email:'orders@roasthouse.example'},
      {id:cid(),name:'Bread (loaf)',stock:5,unit:'loaf',reorder:6,cost:3.5,supplier:'Corner Bakery',par:12,email:'orders@cornerbakery.example'},
      {id:cid(),name:'Avocado (ea)',stock:14,unit:'ea',reorder:20,cost:0.9,supplier:'Green Grocer',par:40,email:'orders@greengrocer.example'}
    ],
    menu:[
      {id:cid(),name:'Flat White',price:4.8,recipe:[{ing:'Milk (L)',qty:0.2},{ing:'Coffee Beans (kg)',qty:0.02}]},
      {id:cid(),name:'Avo Toast',price:12.5,recipe:[{ing:'Bread (loaf)',qty:0.25},{ing:'Avocado (ea)',qty:1}]}
    ],
    sales:[], waste:[]
  };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function cid(){ return Math.random().toString(36).slice(2,9); }
function ingByName(n){ return db.ingredients.find(i=>i.name===n); }

const TABS=[['dash','Dashboard'],['orders','Orders'],['inv','Inventory'],['menu','Menu'],['sell','Log Sale'],['waste','Log Waste']];
let active='dash';

function renderTabs(){
  const nav=document.getElementById('tabs'); nav.innerHTML='';
  TABS.forEach(([id,label])=>{
    const b=document.createElement('button');
    b.textContent=label; b.className=id===active?'active':'';
    b.onclick=()=>{active=id;render();};
    nav.appendChild(b);
  });
}

function stockPill(i){
  if(i.stock<=i.reorder*0.5) return `<span class="pill low">Reorder now</span>`;
  if(i.stock<=i.reorder) return `<span class="pill mid">Low</span>`;
  return `<span class="pill ok">OK</span>`;
}

function costOfItem(item){
  return item.recipe.reduce((sum,r)=>{ const ing=ingByName(r.ing); return sum + (ing?ing.cost*r.qty:0); },0);
}

function render(){
  renderTabs();
  const app=document.getElementById('app');
  if(active==='dash') app.innerHTML=renderDash();
  else if(active==='inv') app.innerHTML=renderInv();
  else if(active==='menu') app.innerHTML=renderMenu();
  else if(active==='sell') app.innerHTML=renderSell();
  else if(active==='waste') app.innerHTML=renderWaste();
  else if(active==='orders') app.innerHTML=renderOrders();
  bindEvents();bindOrders();
}

function renderDash(){
  const lowStock = db.ingredients.filter(i=>i.stock<=i.reorder);
  const wasteCost = db.waste.reduce((s,w)=>{ const ing=ingByName(w.ing); return s+(ing?ing.cost*w.qty:0);},0);
  const salesRevenue = db.sales.reduce((s,sa)=>{ const m=db.menu.find(m=>m.id===sa.menuId); return s+(m?m.price*sa.qty:0);},0);
  const salesCost = db.sales.reduce((s,sa)=>{ const m=db.menu.find(m=>m.id===sa.menuId); return s+(m?costOfItem(m)*sa.qty:0);},0);
  const margin = salesRevenue-salesCost;

  const itemStats = db.menu.map(m=>{
    const sold = db.sales.filter(s=>s.menuId===m.id).reduce((s,x)=>s+x.qty,0);
    const cost = costOfItem(m);
    const marginPct = m.price>0 ? ((m.price-cost)/m.price*100) : 0;
    return {name:m.name, sold, cost, marginPct, price:m.price};
  }).sort((a,b)=>b.sold-a.sold);

  return `
  <div class="grid2">
    <div class="card">
      <h2>Waste cost (logged)</h2>
      <div class="big" style="color:var(--warn)">$${wasteCost.toFixed(2)}</div>
      <div class="muted">${db.waste.length} waste entries</div>
    </div>
    <div class="card">
      <h2>Sales margin (logged)</h2>
      <div class="big" style="color:var(--accent2)">$${margin.toFixed(2)}</div>
      <div class="muted">Revenue $${salesRevenue.toFixed(2)} · Cost $${salesCost.toFixed(2)}</div>
    </div>
  </div>
  <div class="card">
    <h2>Reorder alerts</h2>
    ${lowStock.length? lowStock.map(i=>`<div class="stat"><span>${i.name} <span class="muted">(${i.supplier})</span></span>${stockPill(i)}</div>`).join('') : '<div class="empty">All stock above reorder threshold.</div>'}
  </div>
  <div class="card">
    <h2>Menu item performance</h2>
    <div class="tbl-wrap"><table>
      <tr><th>Item</th><th>Sold</th><th>Cost</th><th>Margin %</th></tr>
      ${itemStats.map(s=>`<tr><td>${s.name}</td><td>${s.sold}</td><td>$${s.cost.toFixed(2)}</td><td>${s.marginPct.toFixed(0)}%</td></tr>`).join('') || `<tr><td colspan="4" class="empty">No sales logged yet</td></tr>`}
    </table></div>
    <p class="muted" style="margin-top:8px">Low margin % + high waste on shared ingredients = candidate for reformulation, portion change, or removal.</p>
  </div>`;
}

function renderInv(){
  return `
  <div class="card">
    <h2>Add ingredient</h2>
    <div class="row">
      <div class="field"><label>Name</label><input id="ni-name" placeholder="e.g. Oat Milk (L)"></div>
      <div class="field"><label>Unit</label><input id="ni-unit" placeholder="L / kg / ea"></div>
      <div class="field"><label>Stock qty</label><input id="ni-stock" type="number" step="0.1"></div>
      <div class="field"><label>Reorder at</label><input id="ni-reorder" type="number" step="0.1"></div>
      <div class="field"><label>Cost/unit ($)</label><input id="ni-cost" type="number" step="0.01"></div>
      <div class="field"><label>Supplier</label><input id="ni-supplier" placeholder="Supplier name"></div>
      <div class="field"><label>Supplier email</label><input id="ni-email" placeholder="orders@supplier.com"></div>
      <div class="field"><label>Order up to (par)</label><input id="ni-par" type="number" step="0.1"></div>
    </div>
    <button class="btn" id="add-ing">Add ingredient</button>
  </div>
  <div class="card">
    <h2>Current stock</h2>
    <div class="tbl-wrap"><table>
      <tr><th>Name</th><th>Stock</th><th>Reorder@</th><th>Cost</th><th>Supplier</th><th>Status</th><th></th></tr>
      ${db.ingredients.map(i=>`<tr>
        <td>${i.name}</td><td>${i.stock} ${i.unit}</td><td>${i.reorder}</td><td>$${i.cost.toFixed(2)}</td><td>${i.supplier||'-'}</td>
        <td>${stockPill(i)}</td><td><button class="del" data-del-ing="${i.id}">✕</button></td></tr>`).join('') || `<tr><td colspan="7" class="empty">No ingredients yet</td></tr>`}
    </table></div>
  </div>`;
}

function renderMenu(){
  const ingOpts = db.ingredients.map(i=>`<option value="${i.name}">${i.name}</option>`).join('');
  return `
  <div class="card">
    <h2>Add menu item</h2>
    <div class="row">
      <div class="field"><label>Name</label><input id="nm-name" placeholder="e.g. Flat White"></div>
      <div class="field"><label>Price ($)</label><input id="nm-price" type="number" step="0.1"></div>
    </div>
    <div class="row">
      <div class="field"><label>Ingredient</label><select id="nm-ing">${ingOpts}</select></div>
      <div class="field"><label>Qty used per item</label><input id="nm-qty" type="number" step="0.01"></div>
      <button class="btn secondary" id="add-recipe-line" type="button">+ Add to recipe</button>
    </div>
    <div id="recipe-draft" class="muted" style="margin-bottom:8px"></div>
    <button class="btn" id="add-menu">Save menu item</button>
  </div>
  <div class="card">
    <h2>Menu items</h2>
    <div class="tbl-wrap"><table>
      <tr><th>Item</th><th>Price</th><th>Cost</th><th>Margin %</th><th>Recipe</th><th></th></tr>
      ${db.menu.map(m=>{ const c=costOfItem(m); const pct=m.price>0?((m.price-c)/m.price*100):0;
        return `<tr><td>${m.name}</td><td>$${m.price.toFixed(2)}</td><td>$${c.toFixed(2)}</td><td>${pct.toFixed(0)}%</td>
        <td class="muted">${m.recipe.map(r=>`${r.ing} ×${r.qty}`).join(', ')}</td>
        <td><button class="del" data-del-menu="${m.id}">✕</button></td></tr>`;}).join('') || `<tr><td colspan="6" class="empty">No menu items yet</td></tr>`}
    </table></div>
  </div>`;
}

let draftRecipe=[];
function renderSell(){
  const opts=db.menu.map(m=>`<option value="${m.id}">${m.name} ($${m.price.toFixed(2)})</option>`).join('');
  return `
  <div class="card">
    <h2>Log a sale</h2>
    <p class="muted">Deducts recipe ingredients from stock automatically.</p>
    <div class="row">
      <div class="field"><label>Menu item</label><select id="sl-item">${opts}</select></div>
      <div class="field"><label>Qty sold</label><input id="sl-qty" type="number" value="1" min="1"></div>
    </div>
    <button class="btn" id="log-sale">Log sale</button>
  </div>
  <div class="card">
    <h2>Recent sales</h2>
    <div class="tbl-wrap"><table>
      <tr><th>Item</th><th>Qty</th><th>Revenue</th></tr>
      ${[...db.sales].reverse().slice(0,15).map(s=>{ const m=db.menu.find(x=>x.id===s.menuId);
        return `<tr><td>${m?m.name:'(deleted)'}</td><td>${s.qty}</td><td>$${m?(m.price*s.qty).toFixed(2):'-'}</td></tr>`;}).join('') || `<tr><td colspan="3" class="empty">No sales logged</td></tr>`}
    </table></div>
  </div>`;
}

function renderWaste(){
  const opts=db.ingredients.map(i=>`<option value="${i.name}">${i.name}</option>`).join('');
  return `
  <div class="card">
    <h2>Log waste</h2>
    <div class="row">
      <div class="field"><label>Ingredient</label><select id="w-ing">${opts}</select></div>
      <div class="field"><label>Qty wasted</label><input id="w-qty" type="number" step="0.1"></div>
      <div class="field"><label>Reason</label><select id="w-reason">
        <option>Spoiled / expired</option><option>Over-prepped</option><option>Customer return</option><option>Spillage/error</option>
      </select></div>
    </div>
    <button class="btn" id="log-waste">Log waste</button>
  </div>
  <div class="card">
    <h2>Waste log</h2>
    <div class="tbl-wrap"><table>
      <tr><th>Ingredient</th><th>Qty</th><th>Cost</th><th>Reason</th></tr>
      ${[...db.waste].reverse().slice(0,15).map(w=>{ const ing=ingByName(w.ing);
        return `<tr><td>${w.ing}</td><td>${w.qty}</td><td>$${ing?(ing.cost*w.qty).toFixed(2):'-'}</td><td>${w.reason}</td></tr>`;}).join('') || `<tr><td colspan="4" class="empty">No waste logged</td></tr>`}
    </table></div>
  </div>`;
}

function bindEvents(){
  const $=id=>document.getElementById(id);
  if($('add-ing')) $('add-ing').onclick=()=>{
    const name=$('ni-name').value.trim(); if(!name) return alert('Name required');
    db.ingredients.push({id:cid(),name,unit:$('ni-unit').value||'ea',stock:parseFloat($('ni-stock').value)||0,reorder:parseFloat($('ni-reorder').value)||0,cost:parseFloat($('ni-cost').value)||0,supplier:$('ni-supplier').value,par:parseFloat($('ni-par').value)||undefined,email:$('ni-email').value});
    save(); render();
  };
  document.querySelectorAll('[data-del-ing]').forEach(b=>b.onclick=()=>{ db.ingredients=db.ingredients.filter(i=>i.id!==b.dataset.delIng); save(); render(); });
  document.querySelectorAll('[data-del-menu]').forEach(b=>b.onclick=()=>{ db.menu=db.menu.filter(m=>m.id!==b.dataset.delMenu); save(); render(); });

  if($('add-recipe-line')) $('add-recipe-line').onclick=()=>{
    const ing=$('nm-ing').value, qty=parseFloat($('nm-qty').value);
    if(!ing||!qty) return;
    draftRecipe.push({ing,qty});
    $('recipe-draft').textContent='Recipe so far: '+draftRecipe.map(r=>`${r.ing}×${r.qty}`).join(', ');
  };
  if($('add-menu')) $('add-menu').onclick=()=>{
    const name=$('nm-name').value.trim(), price=parseFloat($('nm-price').value);
    if(!name||!price||!draftRecipe.length) return alert('Name, price and at least one recipe line required');
    db.menu.push({id:cid(),name,price,recipe:draftRecipe});
    draftRecipe=[]; save(); render();
  };
  if($('log-sale')) $('log-sale').onclick=()=>{
    const menuId=$('sl-item').value, qty=parseInt($('sl-qty').value)||1;
    const item=db.menu.find(m=>m.id===menuId); if(!item) return;
    item.recipe.forEach(r=>{ const ing=ingByName(r.ing); if(ing) ing.stock=Math.max(0,ing.stock-r.qty*qty); });
    db.sales.push({menuId,qty,ts:Date.now()});
    save(); render();
  };
  if($('log-waste')) $('log-waste').onclick=()=>{
    const ing=$('w-ing').value, qty=parseFloat($('w-qty').value), reason=$('w-reason').value;
    if(!ing||!qty) return;
    const i=ingByName(ing); if(i) i.stock=Math.max(0,i.stock-qty);
    db.waste.push({ing,qty,reason,ts:Date.now()});
    save(); render();
  };
}

/* ---------- ONE-CLICK ORDERING ---------- */
db.orders = db.orders || [];
db.settings = db.settings || {webhook:''};

function openOrderNames(){
  return new Set(db.orders.filter(o=>o.status!=='received').flatMap(o=>o.lines.map(l=>l.name)));
}
function poTotal(lines){ return lines.reduce((s,x)=>s+x.qty*x.cost,0); }
function poText(o){
  return `Hi ${o.supplier},\n\nPlease supply the following:\n`+
    o.lines.map(l=>`- ${l.name}: ${l.qty} ${l.unit}`).join('\n')+`\n\nPurchase order ${o.id}. Thanks!`;
}
function mailto(o){
  return `mailto:${o.email}?subject=${encodeURIComponent('Order '+o.id)}&body=${encodeURIComponent(poText(o))}`;
}

function renderOrders(){
  const sug=suggestions();
  const total=sug.reduce((s,g)=>s+poTotal(g.lines),0);
  return `
  <div class="card">
    <h2>Suggested orders</h2>
    ${sug.length? sug.map(g=>`
      <div style="margin-bottom:10px">
        <strong>${g.supplier}</strong> <span class="muted">${g.email||'no email set'} · $${poTotal(g.lines).toFixed(2)}</span>
        <div class="muted">${g.lines.map(l=>`${l.name}: ${l.qty} ${l.unit} (${l.why})`).join(' · ')}</div>
      </div>`).join('') +
      `<button class="btn" id="approve-all">✔ Approve & send all ($${total.toFixed(2)})</button>`
      : '<div class="empty">Nothing to order. Stock is above reorder points (or already on order).</div>'}
  </div>
  ${renderForecast()}
  <div class="card">
    <h2>Order history</h2>
    <div class="tbl-wrap"><table>
      <tr><th>PO</th><th>Supplier</th><th>Total</th><th>Status</th><th></th></tr>
      ${[...db.orders].reverse().map(o=>`<tr>
        <td>${o.id}</td><td>${o.supplier}</td><td>$${o.total.toFixed(2)}</td><td>${o.status}</td>
        <td>${o.status!=='received'?`${o.status==='approved'?`<a href="${mailto(o)}">✉ Email</a> `:''}<button class="btn ghost" data-recv="${o.id}">Received</button>`:''}</td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">No orders yet</td></tr>`}
    </table></div>
  </div>
  <div class="card">
    <h2>Auto-send settings</h2>
    <label>Webhook URL (e.g. Power Automate "When an HTTP request is received" flow that emails the supplier)</label>
    <input id="wh" style="width:100%" placeholder="https://..." value="${db.settings.webhook||''}">
    <div class="row" style="margin-top:8px">
      <div class="field"><label>Safety buffer %</label><input id="buf" type="number" value="${db.settings.buffer}"></div>
      <div class="field"><label>Days of cover after delivery</label><input id="cov" type="number" value="${db.settings.cover}"></div>
    </div>
    <button class="btn ghost" id="gen-demo">Generate 14 days of demo sales</button>
    <p class="muted">With a webhook set, approving sends orders automatically. Without one, each order gets an Email link.</p>
  </div>`;
}

function bindOrders(){
  const $=id=>document.getElementById(id);
  if($('approve-all')) $('approve-all').onclick=async()=>{
    for(const g of suggestions()){
      const o={id:'PO'+Date.now().toString(36)+cid().slice(0,2),supplier:g.supplier,email:g.email,
               lines:g.lines,total:poTotal(g.lines),ts:Date.now(),status:'approved'};
      db.orders.push(o);
      if(db.settings.webhook){
        try{
          await fetch(db.settings.webhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
            body:JSON.stringify({...o,message:poText(o)})});
          o.status='sent';
        }catch(e){}
      }
    }
    save(); render();
  };
  document.querySelectorAll('[data-recv]').forEach(b=>b.onclick=()=>{
    const o=db.orders.find(x=>x.id===b.dataset.recv);
    o.lines.forEach(l=>{ const i=ingByName(l.name); if(i) i.stock+=l.qty; });
    o.status='received'; save(); render();
  });
  if($('gen-demo')) $('gen-demo').onclick=genDemo;
  if($('buf')) $('buf').onchange=()=>{ db.settings.buffer=parseFloat($('buf').value)||0; save(); render(); };
  if($('cov')) $('cov').onchange=()=>{ db.settings.cover=parseFloat($('cov').value)||1; save(); render(); };
  if($('wh')) $('wh').onchange=()=>{ db.settings.webhook=$('wh').value.trim(); save(); };
}

// ---------- FORECASTED DEMAND ----------
const DAY=864e5;
db.settings.buffer = db.settings.buffer ?? 10;   // safety stock %
db.settings.cover  = db.settings.cover  ?? 3;    // days of stock to hold after delivery

function lookbackDays(){
  const ts=[...db.sales,...db.waste].map(x=>x.ts).filter(Boolean);
  if(!ts.length) return 0;
  return Math.min(14, Math.max(1,(Date.now()-Math.min(...ts))/DAY));
}
// Average daily usage of an ingredient = sales (via recipes) + logged waste, over the last <=14 days
function demandPerDay(name){
  const d=lookbackDays(); if(!d) return 0;
  const since=Date.now()-d*DAY; let used=0;
  db.sales.forEach(s=>{
    if(s.ts<since) return;
    const m=db.menu.find(x=>x.id===s.menuId); if(!m) return;
    m.recipe.forEach(r=>{ if(r.ing===name) used+=r.qty*s.qty; });
  });
  db.waste.forEach(w=>{ if(w.ts>=since && w.ing===name) used+=w.qty; });
  return used/d;
}
// Order when stock is low OR forecast says we'll run out before a delivery could arrive.
// Quantity = forecast demand over (lead time + cover days) + safety buffer - current stock.
function suggestions(){
  const busy=openOrderNames(), g={}, buf=1+db.settings.buffer/100, cover=db.settings.cover;
  db.ingredients.forEach(i=>{
    if(busy.has(i.name)) return;
    const dem=demandPerDay(i.name), lead=i.lead??2, daysLeft=dem>0?i.stock/dem:Infinity;
    const low=i.stock<=i.reorder, stockout=daysLeft<=lead+1;
    if(!low && !stockout) return;
    const target=dem>0 ? dem*(lead+cover)*buf : (i.par??i.reorder*2);
    const qty=Math.ceil((target-i.stock)*10)/10;
    if(qty<=0) return;
    const dl=daysLeft.toFixed(1);
    const why=low&&stockout?`low stock, out in ~${dl}d`:stockout?`forecast: out in ~${dl}d`:'below reorder point';
    const s=i.supplier||'Unassigned';
    g[s]=g[s]||{supplier:s,email:i.email||'',lines:[]};
    g[s].lines.push({name:i.name,unit:i.unit,qty,cost:i.cost,why});
  });
  return Object.values(g);
}
function renderForecast(){
  return `<div class="card"><h2>Demand forecast</h2><div class="tbl-wrap"><table>
    <tr><th>Ingredient</th><th>Stock</th><th>Use/day</th><th>Days left</th></tr>
    ${db.ingredients.map(i=>{const d=demandPerDay(i.name),dl=d>0?(i.stock/d).toFixed(1):'–';
      return `<tr><td>${i.name}</td><td>${i.stock} ${i.unit}</td><td>${d>0?d.toFixed(2):'–'}</td><td>${dl}</td></tr>`;}).join('')}
  </table></div><p class="muted">Based on the last ${Math.round(lookbackDays())||0} days of sales and waste. Log sales to improve it.</p></div>`;
}
function genDemo(){
  db.menu.forEach(m=>{
    const base=m.price<8?55:18;
    for(let d=14;d>=1;d--){
      const dow=new Date(Date.now()-d*DAY).getDay(), bump=(dow===0||dow===6)?1.3:1;
      db.sales.push({menuId:m.id,qty:Math.round(base*bump*(0.8+Math.random()*0.4)),ts:Date.now()-d*DAY});
    }
  });
  save(); render();
}

render();
